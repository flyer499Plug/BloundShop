<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BloundShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d0907;
    --card: #171109;
    --card-2: #211810;
    --line: #35271b;
    --orange: #ff8a1f;
    --orange-2: #ffa94d;
    --cream: #f3c9a0;
    --text: #f4ece4;
    --muted: #98877a;
    --danger: #6b6158;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: 0 14px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; }

  /* Шапка с тигровыми полосами */
  header { position: relative; margin: 0 -14px 14px; padding: 26px 18px 18px; overflow: hidden;
    border-bottom: 1px solid var(--line); }
  header::before { content: ""; position: absolute; inset: 0; opacity: .9;
    background:
      repeating-linear-gradient(115deg,
        transparent 0 26px, rgba(255,122,0,.22) 26px 34px,
        transparent 34px 70px, rgba(255,122,0,.12) 70px 74px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, transparent 100%); }
  header > * { position: relative; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none;
    border: 2px solid var(--orange); background: var(--card-2); }
  h1 { margin: 0; font-size: 24px; letter-spacing: 1px; font-weight: 900; text-transform: uppercase;
    color: var(--cream); line-height: 1.05; }
  h1 span { color: var(--orange); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .contact { display: inline-flex; align-items: center; gap: 6px; background: var(--orange); color: #111;
    border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 14px; cursor: pointer;
    white-space: nowrap; }
  .contact:active { transform: scale(.97); }

  /* Фильтры */
  .filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--orange); border-color: var(--orange); color: #111; }
  .chip.toggle { color: var(--muted); }
  .chip.toggle.on { background: var(--card-2); border-color: var(--orange); color: var(--orange); }

  /* Сетка */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column; position: relative; transition: border-color .15s; }
  .card:active { border-color: var(--orange); }
  .ph { aspect-ratio: 3/4; background: var(--card-2); position: relative; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph.empty::after, .slide.empty::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, #1a1a1a 0 18px, #241608 18px 26px); }
  .badge { position: absolute; left: 8px; top: 8px; z-index: 2; background: rgba(0,0,0,.72);
    border: 1px solid var(--orange); color: var(--orange); font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px; backdrop-filter: blur(4px); }
  .card.sold .ph img { filter: grayscale(1) brightness(.55); }
  .card.sold .badge { border-color: var(--danger); color: #bbb; }
  .info { padding: 10px 12px 12px; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.25; margin: 0 0 6px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { color: var(--orange); font-weight: 800; font-size: 16px; }
  .card.sold .price { color: var(--muted); text-decoration: line-through; }
  .sizes { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .sz { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }

  .state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; line-height: 1.5; }

  /* Окно товара */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 20; display: none;
    align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--card);
    border-radius: 22px 22px 0 0; border-top: 2px solid var(--orange); animation: up .22s ease-out;
    padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .slide { flex: none; width: 100%; aspect-ratio: 3/4; max-height: 62vh; scroll-snap-align: center;
    background: var(--card-2); position: relative; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--orange); }
  .body { padding: 8px 18px 0; }
  .body h2 { margin: 8px 0 4px; font-size: 20px; }
  .body .price { font-size: 22px; }
  .status { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; vertical-align: middle; }
  .status.ok { background: rgba(255,122,0,.15); color: var(--orange); }
  .status.no { background: #222; color: #aaa; }
  .label { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .sizes.big .sz { font-size: 14px; padding: 6px 12px; border-radius: 8px; color: var(--text); border-color: #3a3a3a; }
  .desc { color: #cfcfcf; font-size: 14px; line-height: 1.5; margin: 6px 0 0; white-space: pre-line; }
  .cta { display: block; width: calc(100% - 36px); margin: 20px 18px 0; background: var(--orange); color: #111;
    border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; }
  .cta:active { transform: scale(.99); }
  .close { position: absolute; right: 12px; top: 12px; z-index: 3; width: 36px; height: 36px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 20px; cursor: pointer; }
  .sheet-wrap { position: relative; width: 100%; max-width: 560px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo-row">
      <img class="logo" src="logo.jpg" alt="" onerror="this.style.display='none'">
      <div>
        <h1>Blound<span>Shop</span></h1>
        <p class="sub" id="sub">Актуальное наличие</p>
      </div>
    </div>
    <button class="contact" id="contactTop">Написать</button>
  </div>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>
<div class="state" id="state">Загружаем каталог…</div>

<div class="overlay" id="overlay">
  <div class="sheet-wrap">
    <button class="close" id="close">×</button>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
/* ============================================================
   НАСТРОЙКИ — меняйте только этот блок
   ============================================================ */
const CONFIG = {
  // Ваш юзернейм в Telegram БЕЗ значка @
  SELLER_USERNAME: "k3n5oCEO",

  // Ссылка на опубликованную Google Таблицу в формате CSV (см. инструкцию).
  // Пока пусто — показываются демо-товары.
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQopxxBdMEwQOefSlCWjXqHumCDgOPAwCzFcrxOemigliSjH3JURhKgLRM4rdOoWJZ18vnnyl6pXgZ/pub?gid=0&single=true&output=csv",

  CURRENCY: "₽",
  REFRESH_SECONDS: 60   // как часто обновлять каталог, пока мини-апп открыт
};

/* Демо-данные (исчезнут, как только вы вставите ссылку на таблицу) */
const DEMO = [
  { название: "Худи оверсайз чёрное", цена: "5900", размеры: "S, M, L, XL", фото: "", наличие: "да", описание: "Плотный футер, капюшон на кулиске.\nПосадка оверсайз." },
  { название: "Джинсы прямые графит", цена: "4500", размеры: "30, 32, 34", фото: "", наличие: "да", описание: "" },
  { название: "Куртка бомбер", цена: "8900", размеры: "M, L", фото: "", наличие: "да", описание: "" },
  { название: "Футболка с принтом", цена: "2200", размеры: "S, M, L", фото: "", наличие: "да", описание: "" },
  { название: "Свитшот оранжевый", цена: "4900", размеры: "M, XL", фото: "", наличие: "да", описание: "" },
  { название: "Карго-брюки хаки", цена: "5200", размеры: "S, M", фото: "", наличие: "нет", описание: "" }
];

/* ============================================================
   Telegram
   ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#0d0907"); tg.setBackgroundColor("#0d0907"); } catch (e) {}
}

/* ============================================================
   Утилиты
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const SEP = (first.split(";").length > first.split(",").length) ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === SEP) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}

function rowsToItems(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  const idx = (...names) => head.findIndex(h => names.some(n => h.includes(n)));
  const iName = idx("назван", "наименован", "товар", "name"), iPrice = idx("цена", "price"),
        iSizes = idx("размер", "size"), iPhoto = idx("фото", "photo"),
        iStock = idx("налич", "stock"), iDesc = idx("описан", "desc");
  if (iName < 0) throw new Error("Не найден столбец «название». Прочитаны заголовки: " + rows[0].join(" | ").slice(0, 150));
  return rows.slice(1).map(r => ({
    название: r[iName] || "", цена: r[iPrice] || "", размеры: r[iSizes] || "",
    фото: r[iPhoto] || "", наличие: r[iStock] || "", описание: r[iDesc] || ""
  })).filter(x => x.название.trim());
}

function normalize(raw, i) {
  const inStock = /^(да|yes|y|true|1|\+|есть|в наличии)$/i.test(String(raw.наличие).trim());
  const photos = String(raw.фото).split(/[\s,;|]+/).map(s => s.trim()).filter(s => /^https?:\/\/|^\.?\/?[\w\-./%]+\.(jpe?g|png|webp|gif)$/i.test(s));
  const sizes = String(raw.размеры).split(/[,;/|]+/).map(s => s.trim()).filter(Boolean);
  return { id: i, name: raw.название.trim(), price: String(raw.цена).trim(), sizes, photos,
           inStock, desc: String(raw.описание || "").trim() };
}

function fmtPrice(p) {
  const n = Number(String(p).replace(/\s/g, "").replace(",", "."));
  if (!isFinite(n) || p === "") return p || "";
  return n.toLocaleString("ru-RU") + " " + CONFIG.CURRENCY;
}

/* ============================================================
   Состояние и отрисовка
   ============================================================ */
let items = [], activeSize = null, showSold = false;

function render() {
  const allSizes = [...new Set(items.filter(i => showSold || i.inStock).flatMap(i => i.sizes))];
  const order = ["XXS","XS","S","M","L","XL","XXL","XXXL"];
  allSizes.sort((a, b) => {
    const ia = order.indexOf(a.toUpperCase()), ib = order.indexOf(b.toUpperCase());
    if (ia >= 0 && ib >= 0) return ia - ib;
    if (ia >= 0) return -1; if (ib >= 0) return 1;
    return a.localeCompare(b, "ru", { numeric: true });
  });
  if (activeSize && !allSizes.includes(activeSize)) activeSize = null;

  $("filters").innerHTML =
    `<button class="chip ${!activeSize ? "on" : ""}" data-size="">Все размеры</button>` +
    allSizes.map(s => `<button class="chip ${activeSize === s ? "on" : ""}" data-size="${esc(s)}">${esc(s)}</button>`).join("") +
    `<button class="chip toggle ${showSold ? "on" : ""}" data-sold="1">Показать проданное</button>`;

  let list = items.filter(i => (showSold || i.inStock) && (!activeSize || i.sizes.includes(activeSize)));
  list.sort((a, b) => Number(b.inStock) - Number(a.inStock));

  const inCount = items.filter(i => i.inStock).length;
  $("sub").textContent = `В наличии: ${inCount}`;

  $("state").style.display = list.length ? "none" : "block";
  if (!list.length) $("state").textContent = items.length ? "Под этот фильтр ничего нет" : "Пока пусто. Скоро новый завоз!";

  $("grid").innerHTML = list.map(it => `
    <div class="card ${it.inStock ? "" : "sold"}" data-id="${it.id}">
      <div class="ph ${it.photos.length ? "" : "empty"}">
        <span class="badge">${it.inStock ? "В наличии" : "Продано"}</span>
        ${it.photos.length ? `<img loading="lazy" src="${esc(it.photos[0])}" alt="" onerror="this.remove();this.parentNode&&0">` : ""}
      </div>
      <div class="info">
        <p class="name">${esc(it.name)}</p>
        <div class="price">${esc(fmtPrice(it.price))}</div>
        <div class="sizes">${it.sizes.map(s => `<span class="sz">${esc(s)}</span>`).join("")}</div>
      </div>
    </div>`).join("");
}

/* Окно товара */
function openItem(id) {
  const it = items.find(x => x.id === id); if (!it) return;
  const slides = (it.photos.length ? it.photos : [""]).map(p =>
    `<div class="slide ${p ? "" : "empty"}">${p ? `<img src="${esc(p)}" alt="">` : ""}</div>`).join("");
  $("sheet").innerHTML = `
    <div class="gallery" id="gallery">${slides}</div>
    ${it.photos.length > 1 ? `<div class="dots" id="dots">${it.photos.map((_, i) => `<span class="dot ${i === 0 ? "on" : ""}"></span>`).join("")}</div>` : ""}
    <div class="body">
      <h2>${esc(it.name)}</h2>
      <div><span class="price">${esc(fmtPrice(it.price))}</span>
      <span class="status ${it.inStock ? "ok" : "no"}">${it.inStock ? "В наличии" : "Продано"}</span></div>
      ${it.sizes.length ? `<div class="label">Размеры</div><div class="sizes big">${it.sizes.map(s => `<span class="sz">${esc(s)}</span>`).join("")}</div>` : ""}
      ${it.desc ? `<div class="label">Описание</div><p class="desc">${esc(it.desc)}</p>` : ""}
    </div>
    <button class="cta" id="cta">${it.inStock ? "Написать продавцу" : "Спросить о похожем"}</button>`;
  $("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
  $("cta").onclick = () => contact(it);
  const g = $("gallery");
  g.onscroll = () => {
    const i = Math.round(g.scrollLeft / g.clientWidth);
    document.querySelectorAll("#dots .dot").forEach((d, k) => d.classList.toggle("on", k === i));
  };
}
function closeItem() { $("overlay").classList.remove("open"); document.body.style.overflow = ""; }

function contact(it) {
  const text = it ? `Здравствуйте! Интересует: ${it.name}${it.price ? " (" + fmtPrice(it.price) + ")" : ""}` : "Здравствуйте! Хочу уточнить по наличию.";
  const url = `https://t.me/${CONFIG.SELLER_USERNAME}?text=${encodeURIComponent(text)}`;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
}

/* События */
$("filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.sold) showSold = !showSold; else activeSize = b.dataset.size || null;
  render();
});
$("grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (c) openItem(Number(c.dataset.id));
});
$("close").onclick = closeItem;
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeItem(); });
$("contactTop").onclick = () => contact(null);

/* Загрузка данных */
async function load() {
  try {
    let raw;
    if (CONFIG.SHEET_CSV_URL) {
      const sep = CONFIG.SHEET_CSV_URL.includes("?") ? "&" : "?";
      const res = await fetch(CONFIG.SHEET_CSV_URL + sep + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("Ссылка ведёт на веб-страницу, а не на CSV. Опубликуйте лист в формате CSV.");
      raw = rowsToItems(parseCSV(text));
      if (!raw.length) throw new Error("Таблица прочитана, но в ней нет строк с товарами.");
    } else raw = DEMO;
    items = raw.map(normalize);
    render();
  } catch (err) {
    console.error(err);
    if (!items.length) { $("state").style.display = "block"; $("state").textContent = "Не удалось загрузить каталог: " + (err && err.message ? err.message : "ошибка сети"); }
  }
}
load();
if (CONFIG.SHEET_CSV_URL) setInterval(() => { if (!$("overlay").classList.contains("open")) load(); }, CONFIG.REFRESH_SECONDS * 1000);
</script>
</body>
</html>
